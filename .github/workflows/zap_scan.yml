name: OWASP ZAP Security Audit

on:
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab GitHub Actions
  schedule:
    - cron: '0 0 * * 0' # Otomatis berjalan seminggu sekali (Setiap hari Minggu pukul 00:00 UTC)

jobs:
  zap_scan:
    name: OWASP ZAP Security Audit (Frontend & Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment Variables
        run: |
          cat <<EOF > .env
          DB_HOST=db
          DB_PORT=5432
          DB_NAME=stockVision
          DB_USER=stockvision
          DB_PASSWORD=stockvision_pass
          EOF

      - name: Start Docker Containers
        run: |
          docker compose up -d --build

      - name: Wait for Services Health Check
        run: |
          echo "Menunggu layanan backend dan frontend siap..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null && curl -s http://localhost:80 > /dev/null; then
              echo "Seluruh layanan siap!"
              exit 0
            fi
            echo "Menunggu container startup ($i/30)..."
            sleep 2
          done
          echo "Warning: Timeout menunggu healthcheck, melanjutkan scan..."

      - name: Run OWASP ZAP Scan - Frontend (Port 80)
        run: |
          mkdir -p zap-reports
          sudo chmod 777 zap-reports
          docker run --rm -v $(pwd)/zap-reports:/zap/wrk/:rw --network=host \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:80 -r zap_frontend_report.html -m 2 || true

      - name: Run OWASP ZAP Scan - Backend API (Port 8080)
        run: |
          docker run --rm -v $(pwd)/zap-reports:/zap/wrk/:rw --network=host \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8080 -r zap_backend_report.html -m 2 || true

      - name: Upload Security Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-security-reports
          path: |
            zap-reports/*.html
