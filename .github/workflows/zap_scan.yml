name: OWASP ZAP Security Audit

on:
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab GitHub Actions
  schedule:
    - cron: '0 0 * * 0' # Otomatis berjalan seminggu sekali (Setiap hari Minggu pukul 00:00 UTC)

jobs:
  zap_scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment Variables
        run: |
          cp .env.example .env 2>/dev/null || echo "DB_NAME=stockVision" > .env

      - name: Start Docker Containers
        run: |
          docker compose up -d --build
          sleep 15 # Menunggu kontainer selesai inisialisasi

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:80'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Upload Security Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-report
          path: |
            zap_out.html
            zap_out.json
