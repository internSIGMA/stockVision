services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:14-alpine
    container_name: stockvision_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-stockVision}
      POSTGRES_USER: ${DB_USER:-stockvision}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockvision_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stockvision} -d ${DB_NAME:-stockVision}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backend Service (Flask REST API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockvision_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8080:8080"



  # Frontend Service (Vue/Vite Development Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockvision_frontend
    restart: always
    ports:
      - "80:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local